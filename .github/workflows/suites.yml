# The eight suites, on every push of a branch and on every pull request, then the site built and
# deployed beside them, and last the one proof that reaches the deployed origin. On a push of `main`
# declaring a version npm does not hold, one further job publishes the package.
# ADR-0098 is why this side builds rather than the deployment service, what that gives up, and why every
# action here is a digest. ADR-0104 is why the eighth suite is a step of the second job and of neither
# the first job nor a battery. ADR-0109 is why the publication holds no credential, why it is a job of
# this file, and which half of its gate this repository cannot keep. ADR-0111 is why the number asks for
# the publication and no gesture does.
#
# ---------------------------------------------------------------------------
# What the checkout must be, measured rather than chosen
# ---------------------------------------------------------------------------
#
# `fetch-depth: 0` is load-bearing and looks like a cost. Measured at `efb26d1`, by handing
# `deadCitationFaults` the population a depth-1 clone holds:
#
#     citations made:            54
#     faults at full depth:       0
#     faults at fetch-depth: 1:  54
#
# Every citation this repository writes resolves against `git rev-list --all`, so a shallow clone makes
# all fifty-four name a commit the clone does not have. `mutation/history.ts` carries why the population
# is `--all` and not `rev-parse`.
#
# The same line brings the tags, and that half is kept by a guard rather than by this comment:
# `the-address-sweep-reaches-the-commits-and-the-annotated-tags` requires `refs/tags/` to be non-empty,
# so a checkout that stopped fetching them reddens instead of sweeping a smaller graph in silence. Three
# `evidence/*` tags retain seventeen commits `main` does not reach.
#
# ---------------------------------------------------------------------------
# Why the suites are started by npm when the repository installs with pnpm
# ---------------------------------------------------------------------------
#
# `packaging/` packs and installs with npm deliberately - the repository is developed with pnpm and the
# product is consumed with npm, and `packaging/the-archive.ts` carries that argument at length. It finds
# npm through `npm_execpath`, trusting it only when it names `npm-cli.js`, and otherwise looks beside
# `process.execPath` - which is where a Windows node distribution keeps it and not where a Linux one
# does. `pnpm run` would hand it pnpm's own entry point and fall through to that lookup.
#
# So the suites are started by `npm run`, which sets `npm_execpath` to npm's own entry point on every
# platform. `pnpm` is still what installs the tree.
#
# ---------------------------------------------------------------------------
# One job of seven steps, and not seven jobs
# ---------------------------------------------------------------------------
#
# Seven jobs would run in parallel and finish sooner in wall clock. They would also pay for seven
# checkouts and seven installations. Seven *steps* cost one checkout and name the failing suite in the
# log just as precisely.
#
# **This argument used to end *and this repository is private on a free plan where the minutes are
# metered*, and that half is gone.** The repository is public - `gh repo view --json isPrivate` answers
# false - and GitHub does not meter standard runners for a public one. So what is left is one checkout
# against seven, which is a reason about simplicity and no longer one about money.
#
# **It is left standing on the weaker half deliberately, and the contrast is worth a reader's
# attention.** ADR-0145 took its reading as twenty-one jobs of one battery each, which is precisely the
# shape refused here - and it was right there, because the question was wall clock over a run of
# twenty-five minutes rather than over one of two and a half. The shape is chosen per job by what it
# costs, not once by a rule.
#
# ---------------------------------------------------------------------------
# What is deliberately not here
# ---------------------------------------------------------------------------
#
# **A tag push does not run this.** `branches: ['**']` is what excludes it. An `evidence/*` tag names a
# tree from an earlier unit, and running today's suites against it measures nothing about today.
#
# ---------------------------------------------------------------------------
# Why every action is a digest and not a tag
# ---------------------------------------------------------------------------
#
# `actions/checkout@v7` names a tag, and a tag is a pointer whoever owns that repository can move. This
# job would then run code nobody here has seen, on a runner holding this repository's secrets. It is the
# defect this catalogue refuses one floor down and sells the refusal of - a name resolves to whatever
# the other side currently says it resolves to - and the lockfile pins every npm dependency by integrity
# hash while the workflow pinned nothing.
#
# It cost nothing while this runner held nothing worth taking. ADR-0097 puts a Cloudflare API token in
# this repository's secrets, so the guard and the thing it guards arrive together:
# `every-action-a-workflow-uses-is-pinned-to-a-digest` sweeps this folder, and the trailing `# v7` is
# there because forty hexadecimal digits tell a reader nothing and an unreadable pin is one nobody
# raises.
#
# **One battery runs here and the rest do not, and the reason this file used to give has been measured
# and is not confirmed.** ADR-0145.
#
# `meta` collects `mutation/instrument.test.ts`, which spawns `measure.ts fixture` as a child and
# requires every cell to agree - so the `fixture` battery has replayed on `ubuntu-latest`, on both legs
# of the matrix, on every push since `fc41c4e`. Any sentence here that counted the batteries that run
# as none was wrong about that, and it was wrong on the day it was written rather than made so later.
#
# What this file used to say is that a pin is calibrated against runs on the machine that wrote it -
# ADR-0053 for why a draw count and a rate are read together, ADR-0077 for why no rate read off a
# generator is trustworthy to better than an order of magnitude - and that a replay elsewhere therefore
# produces disagreements nobody can attribute to a defect rather than to the platform. **Read on both
# platforms at `26e2000`, that is not what happens.** Nineteen of twenty-one agree on `ubuntu-latest`
# and twenty of twenty-one on `windows-latest`; the four cells that disagree attribute to three
# distinct causes, and exactly one of them is the platform. ADR-0145 carries the table, the durations
# and the criterion, which was committed before either run existed.
#
# **What replaces it is two gates, and ADR-0146 carries them.** On every push, the batteries that can
# say something about the change - derived from `THE_BATTERIES` rather than listed here, because a list
# of twenty-one names in this file is the declaration nothing keeps. Before a publication, all of them,
# because a published version is frozen for life and that is the last commit at which a wrong verdict is
# still correctable.
#
# The price is stated where it is decided rather than here, and it is not small: read at `b20a678` over
# the 39 pushes of `main` since ADR-0124's rewrite, the first gate is 578 s of wall clock at the median
# and 1 497 s at worst, 8 of the 39 selecting nothing at all. It roughly quadruples the time a verdict
# takes to arrive on the commonest push. The second gate is 21 jobs against a ceiling of 20, so one of
# them queues and a publication waits for the whole of it.
#
# **One cell of the instrument is not measured on this platform**, and it is not a weakness of the suite
# here: `C-64` of `cli-install` removes a retry that repairs a failure only Windows has, so on POSIX
# there is no defect for anything to catch and the cell answers `not applicable`. ADR-0147 is why that
# is an applicability rather than a survival, and why no figure this repository publishes moves for it.

name: suites

on:
  push:
    branches: ['**']
  pull_request:
  # **There is no manual trigger, and its absence is a decision rather than a gap.** A publication used
  # to be a dispatch carrying a typed word, which made one decision into two gestures - and between them
  # the tree was corrected and the package was not, twice in two days. ADR-0111 moved the deliberate act
  # onto the version number, which nobody writes by accident. Anything added back here would be a second
  # way to ask for the one thing this repository cannot undo.

# A superseded run measures a tree nobody will merge. **The clause that used to follow - *and the
# minutes are metered* - is gone with the one above it**: this repository is public and GitHub does not
# meter standard runners for a public one. What a cancelled run still saves is a place in the
# concurrency ceiling, which a reading of twenty-one jobs at once made visible rather than theoretical.
#
# **`main` is never cancelled, and this line is where the publication is protected.** `npm publish` is
# the one step of this repository that cannot be undone, and a push arriving while it runs must not be
# able to interrupt it: a cancelled publication is indistinguishable from one that never happened, for
# anybody reading the run - which is the class of failure this repository already met on a deletion that
# reported failure and had removed half of what it was asked to.
#
# **That protection used to read `github.event_name != 'workflow_dispatch'`, and moving the trigger onto
# the version would have quietly repealed it.** Publishing became something a *push* does, so the event
# that was exempt is the event that now publishes - and a second push to `main` would have cancelled a
# publication in flight, reintroducing precisely the failure the exemption existed against. It is worth
# a reader's attention that the old line was not wrong and did not become wrong: it stopped being
# attached to anything.
#
# **The branch is the only condition available**, and that is a fact about when this is evaluated rather
# than a preference. Concurrency is decided before any job runs, so nothing here can know whether this
# run will publish - the version has not been read yet, and the job that reads it has not started. So
# the condition is every run of `main`, which is a superset of the ones that publish. Branches and pull
# requests stay as cancellable as they were.
#
# **What that protects is the run in progress and not every run of `main`, and this line said otherwise
# for as long as it has existed.** `cancel-in-progress` decides one thing; the *pending* half is
# `queue`, which is absent here and therefore `single`, and GitHub's own words for that default are
# that "any existing `pending` job or workflow in the same concurrency group will be canceled and the
# new queued job or workflow will take its place". Measured on 2026-09-05: run `33970943153` on
# `12c9fee` sat pending with **nought jobs** behind a run in progress, `33972213437` was created at
# `14:34:25Z`, and `33970943153` was cancelled at `14:34:26Z` - while `33970163708`, the one actually
# running, was untouched by both. So a second push to `main` does not cost "a duplicated run": it costs
# the queued one, which never starts.
#
# **It does not reach the publication, and the reason is a property of the condition rather than of
# this line.** `packaging/print-whether-to-publish.ts` computes `!held.has(declared.version)` - npm's
# listing against the manifest on disk - so it asks what *is* rather than what changed. A superseding
# push carries the same unpublished version forward, so its own run publishes what the superseded run
# would have: the publication is deferred by one run and not lost. That is ADR-0111's own argument for
# refusing the proxy *did this commit move the number*, which it justified against a bump pushed under
# a later commit; supersession is the same failure with a different cause, and the same condition
# answers it.
#
# **What it does reach is the battery selection, silently.** `which-batteries` is a diff from the
# push's base, so the batteries owed to a superseded push are never chosen by any run - the superseding
# one selects only its own diff. It is bounded by `every-battery`, which a publication waits for
# whatever the per-push selection did, and it is invisible: a superseded run has no jobs, so
# `every-job-answered` is not among them and reports nothing. **`queue: max` is the knob that would
# close it** - up to a hundred pending - and it is not taken here, both because the hole reaches no
# irreversible act and because GitHub refuses `queue: max` beside `cancel-in-progress: true`, which is
# what the expression above evaluates to on every branch. Whether that refusal reads the expression or
# its value is unmeasured, and measuring it means moving this configuration. ADR-0236.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Nothing here writes to the repository. The token is narrowed to what a checkout needs.
permissions:
  contents: read

jobs:
  suites:
    runs-on: ubuntu-latest

    strategy:
      # Every leg reports, because the question this matrix answers is which runtimes pass and not
      # whether one does.
      fail-fast: false
      matrix:
        # Two floors, because the field is one and the populations are two.
        #
        # `engines` declares `^22.15.0 || >=24.0.0`, which is the *consumer* floor: it is derived in
        # `packages/registry/publication.ts` from two APIs `@types/node` marks `@since v22.15.0`, and it
        # is about somebody installing the compiled archive.
        #
        # **22.18.0 is the *contributor* floor, and it was measured here rather than read off a
        # changelog.** Every 22.x release from the consumer floor up was run as a leg of this matrix:
        # 22.15.0, 22.15.1, 22.16.0, 22.17.0 and 22.17.1 all fail at the first suite with
        # `ERR_UNKNOWN_FILE_EXTENSION` on `run-vitest.ts` - one cause, fifteen occurrences - and 22.18.0
        # is the first that runs all seven. Every script here is `node <file>.ts`, so a runtime that
        # does not strip types with no flag cannot start any of them.
        #
        # **The 22.18.0 leg is what keeps that number honest**, and it is a mechanism rather than a
        # declaration: the day the floor rises, this leg reddens. What it does not keep is the other
        # half - that nothing lower works - and buying that would mean carrying the five failing legs
        # for ever to hold a negative. Priced and refused, and said here rather than left for a reader
        # to assume covered.
        node: ['22.18.0', '24']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 54 citations resolve against `git rev-list --all`; a depth-1 clone makes all 54 dead. The
          # header above carries the measurement.
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: contracts
        run: npm run test

      - name: meta
        run: npm run meta

      - name: registry
        run: npm run registry

      - name: validation
        run: npm run validation

      - name: cli
        run: npm run cli

      - name: site
        run: npm run site

      # Packs with `npm pack` and installs the tarball, which resolves `typescript` from the registry.
      # A fresh runner has an empty npm cache, so this step needs the network - and caching pnpm's store
      # above does nothing for it. `packaging/the-archive.ts` names that cost.
      - name: packaging
        run: npm run packaging

      # The eighth suite, and the second that no battery replays. ADR-0107 is why it is not a file of
      # the registry's own suite: it checks a past commit of this repository out and runs that commit's
      # `ledger` script, inside an instrument that manages worktrees of its own - and `registry-storage`
      # would pay for it sixty times per replay.
      #
      # `fetch-depth: 0` above is what makes it possible at all: the commit a binding names is reached
      # by `git worktree add`, and a shallow clone holds nothing to add.
      #
      # It is a step of this job rather than a job of its own because it needs nothing the seven above
      # do not - no network, no deployment, no secret - and because a freeze that has been broken must
      # stop the matrix rather than be reported beside it.
      - name: the freeze
        run: npm run freeze

  # ---------------------------------------------------------------------------
  # The same eight suites on Windows, because one of them is green there and
  # nowhere else
  # ---------------------------------------------------------------------------
  #
  # ADR-0169 is the decision and the readings. ADR-0168 is the defect that asked for it: a refusal that
  # had reached the registry called `process.exit` after a `fetch`, libuv aborted on an assertion in
  # `src/win/async.c`, and git-bash reported the exit code as `127` - *command not found*, on the most
  # likely mistake a stranger makes. It shipped.
  #
  # **`a-refusal-that-reached-the-registry-exits-one-and-says-nothing-on-the-error-stream` is an
  # ordinary guard of `packages/cli/`, so the `cli` step above is what runs it, and it was green on
  # every runner this repository owned while that defect was live.** Measured at `36e4bbb`, one run,
  # both platforms, node v24.19.0, with the defect put back in the one line it lived on:
  #
  #     ubuntu-latest    reddened 2 of 3, that guard green
  #     windows-latest   reddened 3 of 3, that guard red
  #
  # So this leg is not a second opinion about the suites; it is the only machine on which one of their
  # guards can answer at all.
  #
  # **It is a job and not a leg of the matrix above, and the difference is measured.** `site` and
  # `batteries` both wait for `suites`, and `needs` waits for every leg of a matrix - so putting this in
  # there would add its whole duration to the critical path of every push.
  #
  # **Four readings and not one, because the first was published as though a job had a duration.**
  # 257 s at `36e4bbb` in the workflow the reading was taken with, then three in this shape, against
  # 125 s for the same eight steps on `ubuntu-latest`:
  #
  #     checkout, pnpm/action-setup, setup-node, install    83 s   152 s    47 s   100 s   x3.2
  #     the eight suites                                   167 s   164 s   158 s   139 s   x1.20
  #     the job                                            257 s   325 s   211 s   244 s   x1.54
  #
  # **This read *all of the spread is the tooling and none of it is the work*, and the fourth reading
  # made that false.** The suites had gone 167, 164, 158 - six per cent - and then 139. What survives is
  # the comparison rather than the absolute: the tooling spreads 105 s where the suites spread 28, so it
  # dominates without being alone, and `meta` alone moves 41 to 56 s across the four.
  #
  # So a total here is the runner's mood and the per-step table is the reading.
  #
  # `site` waited for it and the clock says so rather than the graph: at `c44a76d` the ubuntu matrix
  # finished at 16:21:34, this at 16:24:59, and `site` started at 16:25:01.
  #
  # **What waits for it is `site`, and `publish` reaches it through that.** The batteries deliberately do
  # not: a battery calibrates against its own suite's control on its own platform, which is the reason
  # `batteries` waits for `suites` at all, and this leg says nothing about that. So the run grows only
  # where nothing else is longer - 20 of the 75 pushes read at `88bfb54` select no battery.
  #
  # **One runtime and not two.** The matrix above answers *which runtimes pass* and carries the
  # contributor floor for that; this answers *which platform passes*, and a second runtime here would be
  # measuring the first question again on a machine that costs twice as much to ask it on.
  #
  # `meta` and `freeze` had never run on `windows-latest` before this leg existed - a battery runs its
  # own folder's configuration, and neither of those two is replayed by any battery. Both are green:
  # 56 s and 7 s, against 32 s and 5 s on `ubuntu-latest`.
  suites-on-windows:
    runs-on: windows-latest

    # 211 s to 325 s over the four readings above. This is a hang detector and not a budget, and the
    # derivation of the one on the Windows battery below is the argument for both - applied here,
    # 325 x (325 / 211) x 1.4554 is 729 s, or 12.2 minutes. It is left at twenty rather than tightened
    # to thirteen because the cost of being generous is a red push somebody sees, where the cost of
    # being tight on that other job is a publication stopped with no verdict. The two bounds are not
    # held to the same margin because they do not fail into the same thing.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The coordinates a reading taken on this leg needs, and that the matrix above does not print
      # because there is only ever one answer there. Which Windows image ran this is the first thing
      # anybody reading a disagreement here will want.
      - name: what this reading was taken on
        shell: bash
        run: |
          node --version
          git --version
          echo "$ImageOS $ImageVersion"

      - name: contracts
        run: npm run test

      - name: meta
        run: npm run meta

      - name: registry
        run: npm run registry

      - name: validation
        run: npm run validation

      - name: cli
        run: npm run cli

      - name: site
        run: npm run site

      - name: packaging
        run: npm run packaging

      - name: the freeze
        run: npm run freeze

  # ---------------------------------------------------------------------------
  # The site, built where the environment is declared
  # ---------------------------------------------------------------------------
  #
  # **This job exists to measure one thing, and it deploys nothing.** `packages/site/build.ts` calls
  # `theRevision`, which refuses a working tree that disagrees with its commit and asks git for the
  # head - so a build is either reproducible from the revision it stamps or it does not happen.
  #
  # **This used to read *whether a checkout on a runner satisfies that has never been measured here*,
  # and every green run of this job had already answered it.** `revision.test.ts` builds a temporary
  # repository on purpose, precisely so it can be dirtied, so the suites above still say nothing about
  # the tree they ran in - but `theRevision` refuses on `git status --porcelain`, which covers untracked
  # files and is therefore stricter than the instrument's own `assertCleanTree`, and the step below has
  # printed nothing on every run. A declared absence carries the date it was true; this one outlived it.
  # ADR-0145.
  #
  # ADR-0097 chose this over letting a build service clone and build, on exactly that: neither
  # environment is proven, and only this one can be measured before anything is served. A failure here
  # is a red branch; the same failure in a deployment pipeline is a failed deployment.
  #
  # A second job rather than an eighth step, because it must not run when a suite is red - `needs`
  # is what says so - and because it needs one runtime rather than the matrix's two. The build is not a
  # test of the runtime floor; it is what the deployment will run, and the deployment runs one.
  # **Both platforms, and the second name is what puts the Windows leg in front of the irreversible
  # act.** `publish` waits for `site`, so `publish -> site -> suites-on-windows` is the path by which a
  # red Windows suite skips a publication - a skipped dependency skips its dependent, twice over. It is
  # named here rather than in `publish`'s own `needs` because the claim is wider than publishing:
  # nothing is *deployed* from a tree whose Windows suites are red either, and this job is what deploys.
  site:
    needs: [suites, suites-on-windows]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # `theRevision` asks this checkout for its head, and `deadCitationFaults` resolves against
          # `--all`. The build needs the first and the suites above need the second; both are this line.
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Printed before the build rather than read out of its failure. `theRevision` names the offending
      # paths when it refuses, but it refuses on the first one; this says what the whole checkout and
      # the install left behind. It has printed nothing on every run so far, which is the reading the
      # header above used to say nobody had.
      - name: what the checkout and the install left behind
        run: git status --porcelain

      - name: build the site
        run: pnpm run site:build

      # Read off the tree that was written, so the log carries what a probe would otherwise have to be
      # run to learn - and so a build that produced a tree without its header file is visible here.
      - name: what was built
        run: |
          find packages/site/out -type f | wc -l
          cat packages/site/out/_headers

      # `pnpm exec` and not `npx`, so the tool that deploys is the one the lockfile pins and a missing
      # install is a failure rather than a download. It is the whole reason wrangler is a dev dependency
      # at all: a repository whose product is that a published version is frozen for life cannot deploy
      # with whatever was newest that morning. The version is printed so the log names it.
      #
      # `CLOUDFLARE_API_TOKEN` is the name wrangler reads from the environment on its own, so nothing
      # here maps it. **No account identifier is set**, deliberately: a token scoped to one account lets
      # wrangler infer it, and if that turns out to be wrong the log will say so - at which point it is
      # added in the open, as the reference it is, rather than as a secret nobody can check. A setting
      # added in case is a setting nobody later knows the reason for.
      #
      # **An observed gap, not explained, recorded where it will be met again.** The first deployment
      # printed three counts that do not reconcile: the step above counted **75** files in the output
      # folder, wrangler reported reading **92** from the same directory in the same job, and uploaded
      # **74**. The upload reconciles - 74 served plus `_headers`, which is read and never served, is the
      # 75 that were built. The 92 reconciles with nothing measured here, and no cause is named for it.
      #
      # **Whether the project exists is asked of a listing and never of an attempt**, which is the
      # method ADR-0100's probes had to repair: a request answers about content, only a listing answers
      # about existence. Deploying to find out would make a first run and a broken run look alike, and
      # creating unconditionally would fail every run after the first.
      # ---------------------------------------------------------------------
      # The last moment this comparison says anything
      # ---------------------------------------------------------------------
      #
      # ADR-0125 carries the decision. An address this tree has served goes on being written; what it
      # says is free to change. Three pages of this site have been rewritten with nothing broken,
      # because the promise the 404 makes is about the address and never about its content.
      #
      # **It runs here and it cannot run after `deploy`.** The origin is still serving the previous
      # deployment at this point, so the two sides of the comparison are two different trees. One step
      # later the origin serves this commit and every address it lists is one this tree has just
      # written - a guard that cannot fail, which is what `packages/site/out` would be compared against
      # if this sat beside `the archive against the origin`.
      #
      # **The coverage is inductive**: each run compares one deployment against the one before it, and a
      # chain of those reaches back to the first. A push whose run never happened is a link missing from
      # that chain, and nothing here can see one.
      #
      # **`main` only, and a branch is not a deployment.** A branch forked before `main` added a page
      # does not write that page, and the origin lists it - so a branch would be red on an address
      # nobody dropped, which is the ordinary state this repository refuses to write a guard for. The
      # deployment is what the promise is about and `main` is what deploys.
      #
      # It gates `deploy` by standing before it: an address is never lost, because the upload that would
      # lose it does not happen.
      - name: what a deployment would drop
        if: github.ref == 'refs/heads/main'
        run: node packaging/print-what-a-deployment-would-drop.ts

      - name: deploy
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm exec wrangler --version
          pnpm exec wrangler pages project list > projects.txt
          if grep -qE '(^|[^a-z0-9-])toopo([^a-z0-9-]|$)' projects.txt; then
            echo 'the project is listed'
          else
            echo 'the project is not listed, so it is created before anything is deployed to it'
            pnpm exec wrangler pages project create toopo --production-branch=main
          fi
          pnpm exec wrangler pages deploy --branch=main --commit-dirty=true

      # ---------------------------------------------------------------------
      # The last proof before anything is published, and the only one that
      # reaches a live host
      # ---------------------------------------------------------------------
      #
      # ADR-0104 is why it is a step of this job rather than an eighth suite or a job of its own. It
      # must not gate the deployment - `suites` already does, and an origin that is down would
      # otherwise stop us shipping the fix for it - so it runs *after* `deploy`, where it also
      # measures what this commit has just published rather than what the previous one did.
      #
      # `npm run` and not `pnpm run`, for the reason the header gives: `packaging/the-archive.ts`
      # finds npm through `npm_execpath` and this is what sets it to npm's own entry point.
      #
      # **A deployment returns before it has propagated**, so the revision answering may still be the
      # previous one. That is a valid proof of the chain and not of this commit, which is why the
      # suite reports the revision it measured against and never asserts it.
      #
      # **The other half of that is not benign and was measured here rather than anticipated.** Part-way
      # through a rollout the origin answers one address from the new commit and another from the old,
      # and `toopo add` refuses a registry that answered from more than one revision - the product
      # working and the measurement not.
      #
      # The suite used to ask the origin whether it agreed with itself before packing anything, and
      # that was refuted at `d739337`: the pre-flight returned on its first attempt, never printing its
      # waiting line, and the installed client read two revisions seconds later. An agreement observed
      # on one reading says nothing about the next. What retries now is the chain itself, bounded, on
      # the client's own refusal - the only observation made at the instant that decides. ADR-0108. The
      # retry is in the suite and not in this file, so that a run started by hand gets it too.
      #
      # On a branch, `deploy` is skipped and this measures the branch's own archive against the
      # published registry - the more useful of the two questions, and the reason it carries no `if`.
      - name: the archive against the origin
        run: npm run origin

  # ---------------------------------------------------------------------------
  # Whether this commit publishes, asked of npm and not of the commit before it
  # ---------------------------------------------------------------------------
  #
  # ADR-0111 carries the decision. The short of it: the question a publication turns on is whether npm
  # already holds the version this tree declares, and every cheaper way of asking is a proxy for that.
  # Comparing against the parent commit answers *did this commit move the number*, which is a different
  # question and misses a bump pushed under a later commit - GitHub runs this once per push, on the tip.
  #
  # **It reads a listing and never `dist-tags.latest`**, which is a pointer and would start meaning
  # something else the day a second channel exists. `packaging/what-npm-holds.ts` carries that argument
  # and the size measurement behind the header it sends.
  #
  # **No `fetch-depth`, no install, and both are consequences rather than economies.** The module reads
  # this checkout's `package.json` and one address; it asks git nothing, so the whole graph would be
  # fetched for no reader, and it imports only node's own modules, so there is nothing to install.
  #
  # **A registry that cannot be read makes this job red**, and the reason that is acceptable is measured
  # rather than assumed: the `packaging` step above already installs the archive, which resolves its one
  # dependency from npm on a runner whose cache is empty. An unreachable registry is therefore already a
  # red run, and this adds no state that was green before. That argument is conditional on the step above
  # keeping its network, and it is written here so the day it stops is the day somebody meets this.
  version:
    runs-on: ubuntu-latest

    outputs:
      unpublished: ${{ steps.whether.outputs.unpublished }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      # The reading is printed as well as returned, because the log is the only place anybody can
      # afterwards see why a run published or did not, and a verdict with neither of its two sides beside
      # it is a verdict nobody can check.
      - name: whether this commit publishes
        id: whether
        run: node packaging/print-whether-to-publish.ts

  # ---------------------------------------------------------------------------
  # The instrument, on every push and before every publication
  # ---------------------------------------------------------------------------
  #
  # ADR-0146 is the decision, the price and what these gates do not reach.
  #
  # This job needs neither the suites nor an install: `published.ts` and its whole import closure reach
  # nothing outside node's own modules, which is the property the `version` job above is built on too.
  # `fetch-depth: 0` is what it does need - the selection is a diff, and a shallow clone holds neither
  # end of one.
  #
  # The base is the pull request's when there is one and the commit before the push otherwise. Either
  # can be absent or unresolvable, and the module answers *every battery* rather than *none* in both
  # cases: a gate whose failure mode is silence is worse than no gate, because a green run is what a
  # reader takes it for.
  which-batteries:
    runs-on: ubuntu-latest

    outputs:
      batteries: ${{ steps.selection.outputs.batteries }}
      any: ${{ steps.selection.outputs.any }}
      everything: ${{ steps.selection.outputs.everything }}
      # The Windows leg's population and the boolean that keeps an empty one from failing the job it
      # feeds. Both come from the same step as the three above, for that step's own reason: one job
      # answers *which batteries* in every sense the file asks it, so two readings cannot disagree
      # about what the instrument holds.
      windows: ${{ steps.selection.outputs.windows }}
      anyWindows: ${{ steps.selection.outputs.anyWindows }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      # Both sides are printed, for the reason the `version` job's step gives: this log is the only
      # place a reader can afterwards see why a battery did or did not run, and a selection with only
      # one of its two sides beside it is a selection nobody can check.
      - name: which batteries this push has to answer for
        id: selection
        run: |
          node mutation/print-which-batteries-to-replay.ts \
            "${{ github.event.pull_request.base.sha || github.event.before }}" \
            "${{ github.sha }}"

  # The first gate. It waits for the suites because a battery calibrates against its own suite's
  # control, so on a red tree every calibration fails at once with a message about the apparatus rather
  # than about the change - and the selection above does not wait, so it is computed while they run.
  #
  # `if` reads the boolean and never the array: GitHub fails a job whose matrix is an empty list rather
  # than skipping it, and 8 of the 39 pushes this was priced over select nothing.
  batteries:
    needs: [suites, which-batteries]

    if: needs.which-batteries.outputs.any == 'true'

    runs-on: ubuntu-latest

    # A hung cell must not hold a runner for six hours, and the number is derived rather than chosen.
    # ADR-0222 carries the whole reading; what belongs here is the arithmetic.
    #
    #     base       3 887 s   registry-storage, 230 cells, on a runner, measured at `6203758`
    #     spread     x 1.042   -> 4 050 s
    #     growth     +  693 s  -> 4 743 s  =  79 minutes
    #
    # **The spread is measured where the work did not move.** Over the twenty-two runs read,
    # `mutation/site.battery.ts` and `packages/site` both have zero commits, so that battery's five
    # readings are five readings of identical work - which is the population ADR-0169's `max/median`
    # requires. It answers 1.042. Every other long battery grew: `cli-install` eight commits,
    # `registry-storage` fourteen.
    #
    # **`max/median` over registry-storage's own readings answers 1.809 and is a trap.** Its median is a
    # reading of a battery that had 163 cells where it now has 230, so the ratio measures the growth
    # rather than the runner. The short batteries are the same trap inverted -
    # `string-levenshtein-spec` answers 1.529 over a job of 34 s.
    #
    # **The growth term is a convention said out loud**: 41 cells at the 16.9 s a cell costs here, which
    # is the margin ADR-0169 derived for the Windows leg. So the bound is 1.22x the measured job and
    # holds 50 cells, ten from the spread and forty-one from the convention.
    #
    # 79 rather than 80 because it carries its own arithmetic in its digits, which is ADR-0205's reason
    # for 60 060.
    timeout-minutes: 79

    strategy:
      # Every selected battery reports. A first disagreement stopping the matrix would answer a
      # different question than the one asked, which is *which of these still agree with themselves*.
      fail-fast: false
      matrix:
        battery: ${{ fromJSON(needs.which-batteries.outputs.batteries) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # `registry-storage` reaches `frozen-for-life.test.ts`, which checks past commits out under
          # `.rebuilt/`, and a shallow clone holds nothing to check out. Every arm of every battery is
          # `HEAD`, so no arm needs this line - that suite does.
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The coordinates a reading of a disagreement needs and that the log would otherwise not carry.
      # `git` is here because the instrument manages worktrees with it, and a worktree's behaviour is a
      # property of the version installed rather than of this repository.
      - name: what this reading was taken on
        run: |
          node --version
          git --version
          echo "$ImageOS $ImageVersion"

      # `assertCleanTree` refuses a working tree carrying uncommitted changes and `assertNoStrayWorktree`
      # refuses a checkout registered beside the root. Both are preconditions of every cell, so what the
      # checkout and the install left behind is read before the battery rather than out of its refusal.
      - name: the tree the instrument requires
        run: |
          git status --porcelain
          git worktree list

      # `npm run` and not `node mutation/measure.ts`, for the reason the header above gives:
      # `packaging/the-archive.ts` finds npm through `npm_execpath`, and the `packaging` battery injects
      # into the folder that holds it. Started any other way, that battery would measure the launcher.
      - name: ${{ matrix.battery }}
        run: npm run battery ${{ matrix.battery }}

  # The second gate, and it is the one `CONTRIBUTING.md` already named: *a full replay is worth its
  # price on exactly two occasions: before a release, and before anything is published to a registry,
  # because that is the last commit at which a wrong verdict is still correctable.*
  #
  # **Its condition is the publishing job's own expression and not a second copy of it.** A gate written
  # beside another gate is free to drift from it, and the shape of that drift here is a publication that
  # happens without the replay it was supposed to wait for. The publishing job takes this in `needs`, so
  # a skipped replay skips the publication rather than releasing it.
  #
  # The matrix is `everything` from the job above rather than a second reading of `THE_BATTERIES`, for
  # the reason that job's own comment gives.
  #
  # **What a publication waits for is the slowest single battery, not the sum of them**, and the
  # distinction is worth writing down because the sum is the number a local replay prints: the forty
  # minutes below are per job and this is one job per battery.
  #
  # **The figures are the runner's own, because a local reading understates them by about two.**
  # Measured on run 32842887678 at `5559932`: `registry-storage` 27 min 18 s, `cli-install`
  # 25 min 49 s, `site` 18 min 55 s, `cli-update` 12 min 44 s, and nothing else above 8 min 17 s. The
  # same three on the machine this was written on are 15 min 6, 9 min 53 and 9 min 16 - so the runner
  # is 1.8 to 2.6 times slower, and a bound argued from a local reading is argued against the wrong
  # population.
  #
  # **The slowest job therefore consumes 68 % of its bound**, not the 38 % a local reading suggests.
  # That is run 32842887678's reading. What used to follow it guessed at what would move it - which of
  # the batteries carry the catalogue, and what a queue costs - and both guesses were wrong. What
  # replaces them is measured. ADR-0162.
  #
  # ---------------------------------------------------------------------------
  # What a contract costs, and what actually spends the bound
  # ---------------------------------------------------------------------------
  #
  # **A contract adds 33 guards to the registry suite and nothing else to either long battery.**
  # Derived file by file from `mutation/census.ts`, with no residue over eight files:
  # `against-the-catalogue` 8n + 13, `coverage` 4n, `implementations` 3n + 3, `response` 7n + 18,
  # `snapshot` 7n + 11, `served-files` 2n, `signature` n + 9, `visibility` n + 5. It is not trusted on
  # its own: at five, six and seven contracts it reproduced to the unit the nine control counts the
  # battery logs print on the runner, from `c58c8cd` to `5559932`.
  #
  # **It read 36, with `against-the-catalogue` at 11n - 4, and it had been stale for one commit.**
  # `483d197` replaced seven `it.each(eachContract)` guards with one and added one, taking that file's
  # census row from 73 to 68 - and the derivation standing beside it was not swept. That is the rule
  # about a decision reaching every surface it settles, arriving on a derived figure rather than on an
  # entry of a list. Re-derived at `210bc7c` from the sources instead of from a fit, because a fit is
  # what went stale: a file collects `(it.each(eachContract)) * n + (plain it)`, and the eight rebuild
  # to the census exactly, 289 against 289.
  #
  # **What is not re-derived is everything standing on the old count.** The 56 s a contract costs, the
  # 3.3 cells and the joint line below were computed at 36 guards, so each overstates by 9 % - in the
  # direction that makes this bound more generous than it reads, never tighter. Recomputing them needs
  # the fifty-nine runs the regression was taken over, which is a reading and not an edit.
  #
  # **A publication commit adds no cell at all.** Neither `b03915c` nor `3ec621c` touches a battery
  # file, and the twelve cells `registry-storage` gained between `7c9906c` and `1008c96` came from six
  # ordinary units. So the catalogue moves the guards and the units move the cells - and it is the
  # cells that are worth watching, which is the opposite of what this comment used to say.
  #
  # **A cell costs 17 s and a contract costs 56 s, so one contract is worth 3.3 cells.** Twelve cells
  # over 78 commits is four contracts of budget, spent with nothing saying so. At 94 cells the
  # bound is reached at the twenty-first contract, between the nineteenth and the twenty-fifth at one
  # standard error; at seven contracts it is reached at 138 cells. The joint line is 133 cells at eight
  # contracts, 125 at ten, 108 at fifteen - and at twenty contracts 94 is already the ceiling.
  #
  # **The 94 is a reading and not a present tense, and this line is what makes it one.** It was written
  # `today's 94 cells`, which is the shape ADR-0018 refuses: a dated number with a present-tense clause
  # beside it, where it is the clause a reader believes. Measured, `registry-storage` held **94 at
  # `3daae2f`**, where the sentence was written and where it was true; **97 at `22ccd46`**; and **103**
  # with this unit - so it was already three out before anything here moved it, and six more after.
  # **The extrapolation is not re-derived**, for
  # the reason the paragraph above gives about the 56 s and the 3.3: recomputing it needs the
  # fifty-nine runs the regression was taken over, which is a reading and not an edit. What is
  # corrected is the tense, and the direction is the safe one - more cells than the figure assumes
  # means the bound is reached sooner than these lines say, so a reader is not being told the margin is
  # larger than it is. ADR-0177.
  #
  # **The method is half the finding, because the raw duration says nothing.** Two runs of identical
  # work - 88 cells over 409 guards, at `f761de0` and `643bf7e` - measured 1 017 s and 1 464 s, and
  # regressing the registry suite's own step on the census count over 59 runs gives 0.0078 s per guard
  # against a standard error of 0.0098, at an r-squared of 0.011. What separates the signal is a
  # denominator: every run carries the registry suite and the cli suite **on one machine**, and the cli
  # census did not move across the window, so their ratio is independent of the machine. It reads
  # 0.7998 over 34 runs at five contracts and 0.8318 over 24 at six, each against a standard error of
  # 0.0065 - 4.2 % per contract, that step at three and a half of them - and 0.8682 at seven, which is
  # one run and carries no error of its own. What the extrapolation rests on is the slope over all 59:
  # 0.000832 per guard against 0.000177, which is 0.0162 s. Anybody who replays the raw regression will
  # conclude there is no effect at all.
  #
  # **`cli-install` does not carry the catalogue's size, and the sentence that said it did was this
  # comment's own, one unit old.** It holds 72 cells and 178 guards at five, six and seven contracts,
  # and four readings of that identical work measured 1 392, 1 477, 1 549 and 1 417 s - so the 3.4 %
  # between the six-contract mean and the seven-contract one sits inside an 11 % spread. Its suite step
  # says the same: 19.60 s, 19.20 s, 20.01 s across the three.
  #
  # **A runner starts 20 of these jobs at once**, which this comment used to declare unmeasured. On run
  # 32842887678, 19 battery jobs start within 2 s of the first and the last four at +28, +31, +33 and
  # +33 s, as the short ones finish. The matrix is 9 + 2n jobs - 23 at seven contracts - and it
  # consumes 6 852 runner seconds against the 32 780 slot-seconds those 20 places offer over the
  # slowest job, so the queue drains in 33 s and concurrency does not bind before the per-job bound
  # does. It closes by measurement rather than by estimate, which is why it is stated here and not on
  # the list of what nothing keeps.
  #
  # **What is on that list is the bound itself.** The 68 % above was computed by hand, in a file that
  # exists to keep other declarations, and nothing compares 40 minutes to what the slowest battery
  # really costs.
  every-battery:
    needs: [suites, version, which-batteries]

    if: >-
      github.ref == 'refs/heads/main'
      && needs.version.outputs.unpublished == 'true'

    runs-on: ubuntu-latest

    # The first gate's number, for the first gate's reason: this job runs the same batteries on the same
    # runner, so a second derivation here would be a second statement free to disagree with it. ADR-0222.
    timeout-minutes: 79

    strategy:
      fail-fast: false
      matrix:
        battery: ${{ fromJSON(needs.which-batteries.outputs.everything) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: what this reading was taken on
        run: |
          node --version
          git --version
          echo "$ImageOS $ImageVersion"

      - name: the tree the instrument requires
        run: |
          git status --porcelain
          git worktree list

      - name: ${{ matrix.battery }}
        run: npm run battery ${{ matrix.battery }}

  # ---------------------------------------------------------------------------
  # The batteries holding a cell no runner above can measure
  # ---------------------------------------------------------------------------
  #
  # ADR-0169 is the decision, ADR-0147 is what this closes. `C-64` of `cli-install` removes the retry
  # from `removeDirectory`, and POSIX unlinks a directory another process is standing in - so off
  # Windows the cell is not injected at all and answers `not-applicable`, correctly. The `killed` half
  # of its pin was therefore exercised by no runner this repository owned, and the guard it names,
  # `a-project-is-removed-while-another-process-still-holds-it`, is named by no other cell at all.
  #
  # Measured at `36e4bbb`, the same battery on the two platforms:
  #
  #     ubuntu-latest    C-64 not-applicable as expected
  #                      never red, not measured on this platform ... (1)
  #     windows-latest   C-64 killed as expected
  #                      a-project-is-removed-... red on C-64, alone on C-64
  #                      never red, not measured on this platform ... (0)
  #
  # **The matrix is derived and never a name typed here.** `batteriesWhereThePlatformDecides` projects
  # the field the instrument already publishes, so a second such cell in another battery adds that
  # battery to this leg with nobody editing this file, and the day the last one stops being decided by
  # the platform this list is empty. `anyWindows` is why that day is a skipped job rather than a red
  # one: GitHub fails a job whose matrix is an empty list.
  #
  # It is not gated on what the push changed. A cell no runner exercises is unmeasured at every commit,
  # so this belongs to the publication rather than to the first gate - which is also the cheaper answer,
  # 13 of the 75 pushes read at `88bfb54` selecting `cli-install`.
  #
  # **What no run has exercised is this job's own matrix, and that is stated rather than left to be
  # found.** A skipped job does not evaluate its `strategy`, so at `c44a76d` - where the condition below
  # was false because npm already held the version - GitHub reported `skipped` without ever resolving
  # `fromJSON`. What *is* established: the condition evaluates and skips rather than failing; the output
  # it reads was printed by `which-batteries` on that run as `1 battery(ies) hold a cell only a Windows
  # runner can measure - cli-install`; and the expression is the same construction as `every-battery`'s,
  # which has resolved on every publication. What is not is this job starting.
  #
  # So the first time it runs will be a publication, which is the shape ADR-0169 refused for the bound
  # one paragraph down and could not refuse for itself: the condition that makes it run is the condition
  # that publishes, and nothing this repository can do makes one happen without the other.
  #
  # ---------------------------------------------------------------------------
  # The bound, derived from the spread rather than chosen
  # ---------------------------------------------------------------------------
  #
  # **A bound is not a guard.** Crossing it detects nothing: the job is killed, every cell it had
  # measured is thrown away with the process, and on this gate that is a publication that stops with no
  # verdict at all. The two errors are not symmetric - too low kills a publication at the one moment
  # that does not replay, too high lets a runaway job burn minutes somebody can see - so it is placed
  # above the worst plausible run and not near the median.
  #
  #     the job, measured at `36e4bbb`                                        2 122 s
  #     x how far the slow tail of this battery's own identical work runs
  #       above its typical, ten readings on ubuntu-latest - 1 233, 1 319,
  #       1 392, 1 417, 1 477, 1 515, 1 541, 1 549, 1 566, 1 632 s, median
  #       1 496: 1 632 / 1 496                                               x 1.0909
  #     = the worst plausible run                                            2 315 s  38.6 min
  #     x what the 40 minutes above already allows the longest job it
  #       was written against: 2 400 / 1 649                                 x 1.4554
  #     =                                                                    3 369 s  56.2 min
  #
  # rounded up to the whole minute the field takes, which is the only rounding here.
  #
  # **The seventh reading arrived one run after this was written, and it is why the figure is 62 and
  # not 61.** ADR-0169 shipped with six readings spanning 1 319-1 549 s and named its own reopening
  # condition - *a seventh falling outside them* - and `c44a76d`, the push that wired this job, measured
  # 1 566 s. The arithmetic was re-run rather than the clause shrugged at. **What that says about the
  # form is worth more than the minute**: the input moved 1.1 % and the answer moved one minute, so the
  # derivation is not sensitive to the reading that broke its own population.
  #
  # ---------------------------------------------------------------------------
  # What re-reads this, and why it is not the range
  # ---------------------------------------------------------------------------
  #
  # **The clause that fired was keyed to the observed range, and that is a treadmill rather than a
  # signal.** The range of a sample grows with the sample: for exchangeable readings the chance that
  # the next one is a new extreme is 2/(n+1), which is 22 % at eight - so *outside 1 319-1 566 s* fires
  # about one time in five for a reason that says nothing about whether this number is wrong. The
  # eighth reading, 1 515 s at `df91920`, is the illustration: a value this population had never seen,
  # silent because of where it happened to fall.
  #
  # **So the condition is keyed to the answer instead.** The bound moves when
  # `2 122 x (max / median) x 1.4554` crosses a whole minute, which at today's population is:
  #
  #     max / median leaving 1.0879 - 1.1074   ->  re-derive; today that is a reading above 1 657 s,
  #                                                or one that pulls the median below 1 473 s
  #     anything else                          ->  57 minutes, and there is nothing to do
  #
  # ---------------------------------------------------------------------------
  # The property any form here has to hold, which outlives this one
  # ---------------------------------------------------------------------------
  #
  # **A derivation that moves in response to a faster run is broken.** Not imprecise - broken. A bound
  # exists to survive the slow tail, so it may only move on evidence about how slow this job can get;
  # a number that loosens because a machine was quick has answered a different question from the one
  # it is asked.
  #
  # **This form was `max / min` and it failed exactly that test.** The tenth reading, 1 233 s at
  # `2903980`, was the *fastest* ever recorded here. The maximum did not move. `max / min` went 1.2373
  # to 1.3236 and the bound would have gone 64 to 69 - a timeout loosening by five minutes because a
  # job ran faster, which is incoherent however carefully the arithmetic is checked.
  #
  # `max / median` asks the question a timeout is about - how far the slow tail runs above the typical -
  # and passes the test by construction. Measured rather than asserted: append a reading of 1 100 s to
  # the ten above and `max / median` answers 57 where `max / min` answers 77.
  #
  # **Test any replacement against that before its arithmetic.** The formula is a detail and has been
  # wrong once; the property is what would have caught it.
  #
  # **A second consequence, and it is why this is better than a ratchet.** `max` only grows but a median
  # moves either way, so this bound can tighten as well as loosen. `max / min` could only ever rise -
  # which reads as conservatism and is really a number with no way back.
  #
  # ---------------------------------------------------------------------------
  # What a later reading is worth, decided here so nobody re-decides it
  # ---------------------------------------------------------------------------
  #
  # **The clause is a reason to look and never an obligation to edit**, and that half is written here
  # because the unit that wrote it nearly missed it: every commit touching the battery below produces
  # another reading, which may move this number again, which would want another commit. So the
  # conclusion is written in advance rather than re-derived by whoever arrives next. **Look, and unless
  # a run is approaching the bound, stop there.** Today the worst plausible run is 38.6 minutes against
  # a bound of 57, so nothing is approaching and nothing is owed.
  #
  # **The one error left in this number is declared with its price rather than bought.** There is a
  # single Windows reading and it is treated as *typical*, which is the honest reading of one draw - a
  # draw lands in the middle more often than at an edge - but it could have been a fast one, in which
  # case this is short by however much. What would settle it is a second Windows reading, and its price
  # is 2 122 s of runner. It is **not** bought now: it would buy precision on a number nothing is near.
  # Buy it on the day a run approaches the bound, which is the same trigger as above and turns a
  # speculative expense into a triggered one.
  #
  # **What this exposes is the bound beside it, which is derived from nothing.** The two ubuntu gates
  # are typed at 40 minutes, so as this battery's slowest reading grows their margin shrinks with nobody
  # deciding anything: across these ten readings it went 42 cells, then 41, then 38. This number
  # re-derived itself three times over the same window and that one did not move at all. `CLAUDE.md`
  # carries it as an entry; the rate is here.
  #
  # **What it assumes, said rather than buried.** That the Windows job's relative spread is the ubuntu
  # one for this battery - there is a single Windows reading and n = 1 measures no spread at all. And
  # that the reading taken was the *fastest* plausible draw, which is the conservative direction: if it
  # was a slow one the bound is generous by however much.
  #
  # **What it does not claim.** It does not bound a hang, which is unbounded by definition. It does not
  # claim 61 is optimal. And it does not claim the spread is stationary - it is six readings of one
  # battery on one platform, and the day a seventh falls outside them this arithmetic is what somebody
  # re-runs.
  #
  # **What it lands on is the check rather than the argument**: 3 420 s over the worst plausible 2 315
  # leaves 1 105 s, which at 27.1 s a cell here is 41 cells - against the 38 the 40 minutes above leave
  # the ubuntu leg over its own worst plausible 1 632. And it is 1.61 times the job that was measured,
  # where the form this replaces had reached 1.95 - a bound approaching twice its subject has stopped
  # being a hang detector.
  #
  # **A second Windows reading was priced and refused.** It costs 2 122 s of runner and takes n from 1
  # to 2, which bounds a tail no better than 1 does; the six ubuntu readings already give the spread for
  # this class of job. Thirty-five minutes of runner to move from one point to two changes no decision
  # here.
  every-battery-on-windows:
    needs: [suites, version, which-batteries]

    if: >-
      github.ref == 'refs/heads/main'
      && needs.version.outputs.unpublished == 'true'
      && needs.which-batteries.outputs.anyWindows == 'true'

    runs-on: windows-latest

    timeout-minutes: 57

    strategy:
      fail-fast: false
      matrix:
        battery: ${{ fromJSON(needs.which-batteries.outputs.windows) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: what this reading was taken on
        shell: bash
        run: |
          node --version
          git --version
          echo "$ImageOS $ImageVersion"

      - name: the tree the instrument requires
        shell: bash
        run: |
          git status --porcelain
          git worktree list

      - name: ${{ matrix.battery }}
        run: npm run battery ${{ matrix.battery }}

  # ---------------------------------------------------------------------------
  # The publication, and the only thing this repository does that cannot be
  # undone
  # ---------------------------------------------------------------------------
  #
  # ADR-0109 carries the argument: why no credential is stored here, why this is a job of this file rather
  # than a workflow of its own, which half of the gate GitHub keeps and which half npm keeps, and what
  # nothing in this repository can read.
  #
  # **It holds no npm credential, and that is the mechanism rather than a convenience.** npm exchanges the
  # identity token GitHub mints for a short-lived publishing credential and writes a provenance
  # attestation itself, so the archive a reader installs names the commit and the run it was built from.
  # The alternative is a granular token, which npm caps at ninety days for writing - a secret on a runner
  # that a person mints again four times a year from a personal account, and a fifth thing to lose.
  #
  # **`needs: site` is the gate and it is not a formality either.** It reaches both matrix legs through
  # `site`, so nothing is published from a tree whose suites are red; and it puts the publication after
  # the deployment and after the proof that reaches it, which is the order
  # `packaging/against-the-origin/` exists to make checkable. A client is published to talk to an origin
  # already serving the revision it was built against, and that is the sentence the eighth suite turns
  # into a red.
  #
  # **The fourth coordinate is `version`, and it is what replaced the typed word.** `needs` now names two
  # jobs because the gate asks two things: that everything measurable about this tree is green, and that
  # what it declares is not already out there. The second is what makes the deliberate act the number
  # itself - a string nobody edits by accident, in the one file whose whole subject is what gets
  # published. ADR-0111.
  #
  # **The reading is taken minutes before this job runs, and that is safe in one direction only.** If npm
  # gained this version in between, `npm publish` refuses it and this job is red - the same red as before
  # any of this existed. What cannot happen is the other way round: a version npm holds cannot be
  # published over, so a stale reading costs a red run and never a wrong archive.
  publish:
    # `every-battery` carries this job's own condition, so a publication that this gate would not fire
    # for cannot happen: a skipped dependency skips its dependent, and the two are skipped together.
    # ADR-0146.
    #
    # **`every-battery-on-windows` is named here for the same reason and not for a different one.** It
    # carries this job's condition too, so a publication this gate would not fire for cannot happen; and
    # a replay that runs somewhere no other job can measure is exactly the replay a publication must not
    # go without. `every-job-that-replays-a-battery-is-one-the-publication-waits-for` is what keeps a
    # third from being added and left out of this list. ADR-0169.
    needs: [site, version, every-battery, every-battery-on-windows]
    if: >-
      github.ref == 'refs/heads/main'
      && needs.version.outputs.unpublished == 'true'
    runs-on: ubuntu-latest

    # `npm` is a GitHub environment restricted to `main` there, and named in npm's trusted publisher here.
    # **It is the only half of the branch gate that a branch cannot rewrite**: the `if` above lives in a
    # file any branch may edit, and npm's own configuration carries no branch at all. ADR-0109 states both
    # halves and which of them this repository is unable to keep.
    environment: npm

    permissions:
      contents: read
      # What npm exchanges for a publishing credential, granted to this job and to no other. At the top of
      # this file it would reach every job of every pull request, and npm accepts that token as this
      # package's publisher.
      id-token: write

    steps:
      # No `fetch-depth: 0`, and the contrast with the two jobs above is the reason rather than an
      # omission. Those need the whole graph - fifty-four citations resolve against `--all`, and the site
      # is stamped with a revision. `packaging/build.ts` asks git nothing at all: it removes `dist/`, runs
      # the compiler, and prunes what the published entry point cannot reach.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      # `registry-url` is what npm's own documented example for trusted publishing carries, and it is what
      # writes the registry into the runner's npm configuration. Nothing is written beside it, because
      # there is nothing to write.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Printed rather than asserted, the way the deploy step above names wrangler's version. Trusted
      # publishing needs npm 11.5.1 or later; this is the line a run that fell below it is read from, and
      # a comparison here would be this repository transcribing somebody else's floor into a file that
      # cannot be told when it moves.
      - name: which npm publishes
        run: npm --version

      # `npm publish`, and no flag.
      #
      # **`--provenance` is not passed on purpose.** npm writes the attestation on its own when the
      # publication is a trusted one, so the flag would be a second statement of that - free to disagree
      # with the registry's configuration, which is the side that actually decides. `--access public` is
      # not passed either: it is documented for a first publication, and this package has been public
      # since 1.0.0.
      #
      # `prepack` runs `packaging/build.ts`, so the archive cannot carry code older than these sources,
      # and `files` decides what enters it.
      - name: publish
        run: npm publish

  # The last job, and the only one whose subject is this run rather than this repository.
  #
  # **A job killed by its own `timeout-minutes` reports `cancelled`, and `cancelled` is not `failure`.**
  # The run concludes `cancelled`, nothing is red, and a reader looking for a red finds none. Measured:
  # `batteries (registry-storage)` was killed by the 40-minute bound on six pushes of `main` between
  # `1238833` and `3078f81`, and the five pushes in between selected no battery at all - so the greens
  # either side say nothing about it. It has not completed since `6d03933`, at 39 min 49 s.
  #
  # A bound that is too small and a crossing nobody sees are one fault. ADR-0162 is the precedent and
  # ADR-0222 is this one; raising a bound without this job is a reprieve, because the next crossing is
  # silent again.
  #
  # **It cannot gate itself**, and nothing can: a job that reports on `needs` has no reading of its own
  # outcome. What stands in place of that is that its whole step is a JSON read of an expression the
  # runner has already resolved, so the bound below is four orders of magnitude above the work.
  #
  # `if: always()` rather than `failure()`, because `failure()` is exactly what a cancelled job does not
  # produce - which is the whole subject.
  every-job-answered:
    needs: [suites, suites-on-windows, site, version, which-batteries, batteries, every-battery, every-battery-on-windows, publish]

    if: always()

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      # `toJSON(needs)` is passed through the environment rather than interpolated into the command,
      # so no job name or result can be read as shell.
      - name: every job this run needed either answered or was skipped
        env:
          THE_JOBS_THIS_RUN_NEEDED: ${{ toJSON(needs) }}
        run: node mutation/check-every-job-answered.ts
